[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uwb-lab"
version = "0.1.0"
description = "Small live dashboard and recorder for the UWB semester project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "pyserial>=3.5,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "uvicorn>=0.34,<1",
    "websockets>=14,<17",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9", "ruff>=0.9,<1"]
notebook = ["ipykernel>=6", "matplotlib>=3.8,<4", "pandas>=2,<4", "plotly>=5,<7"]

[project.scripts]
uwb-lab = "uwb_lab.__main__:main"

[tool.setuptools.package-data]
uwb_lab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Small university project: catch real mistakes, do not enforce style dogma.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI dependency defaults are idiomatic calls in argument position
]
