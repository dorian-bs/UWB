[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uwb-lab"
version = "0.1.0"
description = "Small live dashboard and recorder for the UWB semester project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pyserial>=3.5,<4",
    "uvicorn>=0.34,<1",
    "websockets>=14,<17",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9"]

[project.scripts]
uwb-lab = "uwb_lab.__main__:main"

[tool.setuptools.package-data]
uwb_lab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
